name: LikeBeacon
version: ${version}
main: dev.biga.likebeacon.LikeBeaconPlugin
api-version: "1.21"
description: "Likes, chat reactions, and a social feed for positive communities."

commands:
  like:
    usage: "/like <player> <reason...> | /like #<code> | /like feed | /like ranking | /like mine | /like log"

permissions:
  likebeacon.use:
    default: true
  likebeacon.admin:
    default: op
  likebeacon.limit.bypass:
    default: op
