name: Likes
version: ${version}
main: dev.example.likes.LikesPlugin
api-version: "26.2"
description: "In-game likes and reactions for positive community vibes."

commands:
  like:
    usage: "/like <player> <reason...> | /like #<code> | /like feed | /like ranking | /like mine | /like log"

permissions:
  likes.use:
    default: true
  likes.admin:
    default: op
  likes.limit.bypass:
    default: op
